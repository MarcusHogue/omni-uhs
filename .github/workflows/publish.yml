name: Publish images

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: proxy
            dockerfile: proxy/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A Docker reference must be lowercase, but `github.repository_owner`
      # keeps the account's own capitalisation ("MarcusHogue"), which buildx
      # rejects outright:
      #   invalid reference format: repository name must be lowercase
      - name: Lowercase the image namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # `latest` for `docker compose pull`, the SHA so a bad deploy can be
          # rolled back to a specific build.
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/omni-uhs-${{ matrix.name }}:latest
            ghcr.io/${{ steps.ns.outputs.owner }}/omni-uhs-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
