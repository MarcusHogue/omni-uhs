name: Publish images

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # The two images are independent. Without this, a transient failure in
      # one cancels the other mid-build and a release publishes nothing --
      # observed once already, from a Docker Hub timeout booting buildkit.
      fail-fast: false
      matrix:
        include:
          - name: proxy
            dockerfile: proxy/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # Booting buildkit pulls moby/buildkit from Docker Hub, which is
      # rate-limited and times out often enough to matter. One retry turns the
      # usual blip into a slow build instead of a failed release.
      - uses: docker/setup-buildx-action@v4
        id: buildx
        continue-on-error: true
      - if: steps.buildx.outcome == 'failure'
        name: Retry the buildx setup
        uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A Docker reference must be lowercase, but `github.repository_owner`
      # preserves the account's own capitalisation, which buildx rejects
      # outright when it contains any:
      #   invalid reference format: repository name must be lowercase
      - name: Lowercase the image namespace
        id: ns
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          # Registries match tags as literal strings and will not expand an
          # abbreviated Git object id, so a short SHA has to be published as its
          # own tag or `:abc1234` is a 404. It is the form anyone actually types
          # into a NAS GUI, so it is worth having.
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Baked into both images so the app can tell you which build you are
          # running, and notice when the browser and the proxy disagree.
          build-args: |
            APP_VERSION=${{ steps.ns.outputs.short }}
          # `latest` for `docker compose pull`; the full and short SHA so a bad
          # deploy can be rolled back to a specific build by either name.
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/omni-uhs-${{ matrix.name }}:latest
            ghcr.io/${{ steps.ns.outputs.owner }}/omni-uhs-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ steps.ns.outputs.owner }}/omni-uhs-${{ matrix.name }}:${{ steps.ns.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
